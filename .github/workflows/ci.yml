name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; never cancel a main-branch run mid-flight, so
  # every merged commit gets a CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Jobs run in parallel on separate runners, so wall-clock is the slowest job
# instead of the sum of all steps. `ci` aggregates them into the single status
# check that branch protection points at.
#
# Cache keys follow the write-every-run pattern: `github.sha` makes the key
# unique so the post step always saves, and `restore-keys` falls back to the
# newest previous entry. A key that is a pure content hash (e.g. of bun.lock)
# would hit exactly and never save again, freezing the cache at its first-ever
# state — that is only correct for the bun install cache, whose content for a
# given lockfile IS stable.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `changeset status` diffs against the base branch

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # single source of truth: packageManager

      - name: Cache bun & turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bunx oxfmt --check

      # The type-aware rules resolve the workspace packages through their
      # built `dist` types; without the build every import from
      # `@createcms/*` is an error type.
      - name: Build packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Lint
        run: bun run lint

      - name: Changeset status (non-blocking)
        if: github.event_name == 'pull_request'
        run: bunx changeset status --since=origin/${{ github.base_ref }}
        continue-on-error: true

  # Decides whether the browser job has to run: it is the one job that
  # downloads a browser, so it runs for changes that can affect the react
  # package (its sources, the schema types it depends on, the lockfile, this
  # workflow) — and always on main. Computed with git against the merge base
  # so no third-party path-filter action is needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      react: ${{ steps.filter.outputs.react }}
      registry: ${{ steps.filter.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "react=true" >> "$GITHUB_OUTPUT"
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base="$(git merge-base "origin/$BASE" HEAD)"
          files="$(git diff --name-only "$merge_base" HEAD)"
          if echo "$files" | grep -qE '^(packages/react/|packages/schema/|bun\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "react=true" >> "$GITHUB_OUTPUT"
          else
            echo "react=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(apps/docs/registry/|apps/docs/registry.json|apps/docs/public/r/|apps/docs/package.json|apps/docs/scripts/check-registry.mjs|apps/docs/components.json|bun\.lock$|turbo.json|\.github/workflows/ci\.yml$)'; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"
          fi

  # Pull requests are squash-merged, so the PR title becomes the commit subject on
  # main — that title is what the Conventional Commits convention applies to, and
  # what this job checks (CONTRIBUTING.md → "Commit conventions"). It also enforces
  # the rule the convention exists for: pre-1.0 a `minor` changeset for
  # @createcms/core IS a breaking change, so it must carry `!` / a BREAKING CHANGE
  # footer. Pull-request-only; `ci` allows it to be skipped on push.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changeset cross-check diffs against the base branch

      # Plain Node, no dependencies: the checker is a single script, so this job
      # needs neither a bun install nor a commitlint toolchain.
      - name: Check commit convention
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commit-message.mjs --base origin/${{ github.base_ref }}

      # BREAKING-CHANGES.md is hand-maintained, so its mirrored docs page can
      # drift between releases (the changelog page cannot — it is written by the
      # release step). Same script, verify-only mode.
      - name: Docs pages in sync with their sources
        run: node scripts/sync-changelog.mjs --check

      # The release bookkeeping helpers are plain Node too: `node --test` keeps
      # the PR-to-package attribution honest without a Linear connection.
      - name: Release bookkeeping unit tests
        run: node --test scripts/linear-release-attribution.test.mjs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun & turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-typecheck-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # .test-schema holds the content-addressed PGlite dumps (pgdata-<hash>.tar)
      # the test DB boots restore from; caching them skips the template rebuild
      # on every run. Stale entries are harmless (content-addressed) and pruned
      # by age from within the test utils.
      - name: Cache bun & test dumps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            packages/cms/.test-schema
          key: ${{ runner.os }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-${{ matrix.shard }}-
            ${{ runner.os }}-test-

      - name: Install
        run: bun install --frozen-lockfile

      # The test DBs are worker-lived PGlite singletons with a truncate reset
      # per test (src/test-utils/db.ts) — required on Linux, where dropped
      # PGlite instances are never reclaimed (~200MB each, permanently): a
      # boot-per-test suite OOM-killed these runners. --maxWorkers=2 bounds
      # how many worker processes accumulate singletons. --expose-gc arms the
      # opportunistic gc() for the rare throwaway instances.
      #
      # Coverage rides along on the shards instead of getting its own full-suite
      # job: the tests are already running here, and instrumenting them costs far
      # less than executing all 1.3k of them a second time. `--reporter=blob`
      # writes .vitest-reports/blob-<i>-<n>.json, which carries this shard's
      # coverage map alongside its results; the `coverage` job merges the four.
      # A shard sees a quarter of the suite, so its own numbers are meaningless —
      # COVERAGE_THRESHOLDS=off keeps the floors from being checked here (see
      # packages/cms/vitest.config.ts) and the merged report enforces them once.
      - name: Test (shard ${{ matrix.shard }}/4)
        working-directory: packages/cms
        env:
          NODE_OPTIONS: --expose-gc
          COVERAGE_THRESHOLDS: 'off'
        run: >
          bunx vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=2
          --coverage --coverage.reporter=text-summary
          --reporter=default --reporter=blob

      # include-hidden-files: .vitest-reports is a dotfile directory, which
      # upload-artifact skips by default — without this the artifact is empty and
      # the coverage job fails on missing blobs.
      - name: Upload coverage blob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: packages/cms/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # Enforces the directory-level coverage floors in packages/cms/vitest.config.ts.
  # `--merge-reports` re-runs the reporters over the four shards' blobs without
  # re-running a single test, so the numbers it checks are the whole suite's.
  # `needs: test` means a shard failure fails CI before this runs, rather than
  # reporting a bogus coverage drop from a missing blob.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-coverage-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download coverage blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: packages/cms/.vitest-reports

      - name: Merge shard reports and check thresholds
        working-directory: packages/cms
        run: bunx vitest run --merge-reports --coverage

  test-react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun & turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-test-react-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-react-

      - name: Install
        run: bun install --frozen-lockfile

      # The node/happy-dom suite of @createcms/react and the compile-time
      # tests of both new packages (`*.type-check.ts` files are covered by
      # tsc). turbo builds @createcms/schema first (`test` depends on ^build).
      - name: Test @createcms/react
        run: bunx turbo run test --filter=@createcms/react

      - name: Type-check @createcms/schema and @createcms/react
        run: bunx turbo run check-types --filter=@createcms/schema --filter=@createcms/react

  # Real Chromium via Playwright (vitest browser mode). Skipped when nothing
  # under packages/react, packages/schema, bun.lock or this workflow changed
  # (see `changes`); `ci` allows that skip.
  browser-tests:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The Playwright browser download is keyed by the lockfile: the
      # playwright version pinned there decides which Chromium build is
      # needed, and a lockfile change is the only thing that changes it.
      - name: Cache bun, turbo & Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
            .turbo
          key: ${{ runner.os }}-browser-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-browser-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: packages/react
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bunx turbo run test:browser --filter=@createcms/react

  registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-registry-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-registry-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build registry
        run: bunx turbo run registry:build --filter=docs

      - name: Check committed registry output
        run: git diff --exit-code -- apps/docs/public/r

      - name: Check registry assertions
        run: bun run --filter=docs registry:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun, turbo & next
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
            apps/docs/.next/cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # env-10: `next build` never connects to the database, so a stale generated
      # schema (env-01) compiles green yet 500s at runtime. Boot the built example
      # — it runs on in-process PGlite and seeds on first request, so no database
      # service is needed — and assert GET / renders the seeded content. This is
      # the guard that turns that runtime regression red.
      - name: Smoke-test example (boot & assert runtime)
        run: |
          port=3100
          cd examples/minimal
          bun run build
          PORT="$port" bun run start -- --port "$port" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          # Poll until the server accepts a connection (covers the boot gap).
          # curl exits 0 for any HTTP response, so a live-but-500 server also
          # breaks the loop and the assertion below then fails fast on it.
          for _ in $(seq 1 60); do
            curl --silent --output /dev/null "http://localhost:$port/" && break
            sleep 1
          done
          # Assert GET / is 200 AND contains the seeded content; fail otherwise.
          body="$(mktemp)"
          code="$(curl --silent --output "$body" --write-out '%{http_code}' "http://localhost:$port/" || true)"
          echo "GET / -> HTTP $code"
          if [ "$code" != "200" ] || ! grep -q "Hello from @createcms/core" "$body"; then
            echo "::error::Example smoke test failed (HTTP $code): runtime is broken (env-01/env-10)."
            cat "$body"
            exit 1
          fi
          echo "Example smoke test passed: GET / returned 200 with seeded content."

      - name: Validate published packages
        run: |
          # `esm-only` (not `node16`): the packages ship no CJS build, so the
          # node16-cjs resolution is skipped by design rather than reported as
          # CJSResolvesToESM on every subpath. Every other rule stays active.
          # Consumers require()-ing these packages rely on Node's require(esm),
          # which is why engines.node is >=22.12. `bunchee lint` is the
          # bunchee 7 package check (export-condition order, declared
          # outputs, workspace: ranges in published dependency fields).
          for pkg in packages/cms packages/schema packages/react; do
            bunx bunchee lint --cwd "$pkg"
            bunx --yes publint "$pkg"
            bunx --yes @arethetypeswrong/cli --pack "$pkg" --profile esm-only
          done

  # The one status check branch protection should require. Green only when
  # every needed job succeeded; red on any failure, skip, or cancellation —
  # except `commits`, which only exists on pull requests and is skipped on
  # push, and `browser-tests`, which is skipped when the react package cannot
  # be affected; a failing `changes` job fails `ci`.
  ci:
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        changes,
        commits,
        typecheck,
        test,
        coverage,
        test-react,
        browser-tests,
        registry,
        build,
      ]
    if: always()
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: commits, browser-tests, registry
