name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # changesets attribution + tag history

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node (npm publish + provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pin the major so a broken npm@latest can't change publish behaviour.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install
        run: bun install --frozen-lockfile

      # Gate the release on the PUBLISHED package's own lint/type-check/test/build.
      # Scoped to @createcms/core so an unrelated docs/example break cannot block a
      # package publish (rel-08), while a failing package still stops the release
      # (ci-02 / rel-01).
      - name: Verify & build @createcms/core
        run: |
          bunx oxlint packages/cms
          bunx turbo run check-types test build --filter=@createcms/core

      - name: Create release PR or publish
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: publishing uses OIDC trusted publishing
          # (configured on npmjs.com). The package is set to "disallow tokens".
          NPM_CONFIG_PROVENANCE: true
