name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets attribution + tag history

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node (npm publish + provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pin the major so a broken npm@latest can't change publish behaviour.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install
        run: bun install --frozen-lockfile

      # Gate the release on the PUBLISHED package's own lint/type-check/test/build.
      # Scoped to @createcms/core so an unrelated docs/example break cannot block a
      # package publish (rel-08), while a failing package still stops the release
      # (ci-02 / rel-01).
      - name: Verify & build @createcms/core
        run: |
          bunx oxlint packages/cms
          bunx turbo run check-types test build --filter=@createcms/core

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: publishing uses OIDC trusted publishing
          # (configured on npmjs.com). The package is set to "disallow tokens".
          NPM_CONFIG_PROVENANCE: true

      # Bookkeeping only: tells Linear which issues went out in which version by
      # moving everything in `Merged` to `Done`. Runs ONLY on an actual publish,
      # never on the version PR. The script swallows its own errors — a missing
      # LINEAR_API_KEY or a Linear outage must not turn a successful publish
      # into a red run; `continue-on-error` covers whatever it cannot catch.
      # Problems are reported as warning annotations on the run instead.
      - name: Close shipped Linear issues
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/linear-release.mjs
