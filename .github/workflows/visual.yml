name: Visual

# Screenshot comparisons of the registry chrome (apps/docs, *.visual.test.tsx).
# Both jobs run in the same pinned Playwright container, so fonts and
# antialiasing match the committed references; references are never made on
# a developer machine.
#
# - compare: on pull requests, once references are committed.
# - update: on demand (Actions > Visual > Run workflow, on a feature branch);
#   writes new references and uploads them as the `visual-references`
#   artifact. Review the images, then commit them to
#   apps/docs/src/**/__visual__/.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing to compare until references are committed.
      - name: Find references
        id: refs
        run: |
          if find apps/docs/src -path '*__visual__*' -name '*-linux.png' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.refs.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        if: steps.refs.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Build @createcms/react
        if: steps.refs.outputs.present == 'true'
        run: bunx turbo run build --filter=@createcms/react

      - name: Compare screenshots
        if: steps.refs.outputs.present == 'true'
        working-directory: apps/docs
        run: bun run test:visual

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: apps/docs/.vitest/attachments

  update:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build @createcms/react
        run: bunx turbo run build --filter=@createcms/react

      - name: Write references
        working-directory: apps/docs
        run: bun run test:visual --update

      - name: Upload references
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-references
          path: apps/docs/src/**/__visual__/
